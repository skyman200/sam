<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
  content="width=device-width,
  initial-scale=1">
<style>
:root { --ink: #1A1A1A; --sub: #555;
  --mut: #6B6B6B; --blue: #1F4E9A;
  --mark: #FFF1A6; --paper: #F4F3EE;
  --line: rgba(26, 26, 26, .12);
  --ease: cubic-bezier(.22, 1, .36, 1); }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 20px 48px;
  background: var(--paper); color: var(--ink);
  font: 18px/1.5 "Apple SD Gothic Neo",
    "Malgun Gothic", sans-serif; }
main { max-width: 640px; margin: 0 auto; }
h1 { font-size: 32px; font-weight: 600;
  line-height: 1.2; margin: 0 0 4px; }
.lead { color: var(--sub); margin: 0 0 20px; }
.meta { color: var(--mut); font-size: 16px; }
button { display: block; width: 100%;
  font: inherit; font-weight: 600;
  padding: 16px 20px; margin: 12px 0 0;
  border-radius: 10px; cursor: pointer;
  color: var(--ink); background: #fff;
  border: 2px solid var(--ink);
  transition: background-color .15s var(--ease),
    transform .15s var(--ease); }
button:hover { background: #EDECE6; }
button:active { transform: scale(.98); }
button:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px; }
button.main { background: var(--blue);
  border-color: var(--blue); color: #fff; }
button.main:hover { background: #17407E; }
.card { background: #fff; padding: 20px;
  border: 1px solid var(--line);
  border-radius: 12px; margin: 12px 0;
  animation: in .3s var(--ease) both; }
.card p { margin: 0; }
.sum { margin-top: 16px; padding: 12px 16px;
  background: var(--mark); border-radius: 8px;
  white-space: pre-wrap; }
.sum:empty { display: none; }
a { color: var(--blue); word-break: break-all; }
#msg { min-height: 28px; margin: 20px 0 0; }
@keyframes in {
  from { opacity: 0; transform: translateY(8px); }
}
@media (prefers-reduced-motion: reduce) {
  .card { animation: none; }
}
</style>
</head>

<body>
<main>
<h1>요약 노트</h1>
<p class="lead">필기를 칸마다 3줄로 줄입니다</p>
<button class="main"
  onclick="showNotes()">필기 불러오기</button>
<button onclick="sumAll()">전체 요약</button>
<button onclick="makePdf()">PDF로 저장</button>
<p id="msg" class="meta"></p>
<p id="pdf"></p>
<div id="list"></div>
</main>

<script>
// 아이디로 화면 요소를 찾습니다
function el(id) {
  return document.getElementById(id);
}
// 요소를 새로 만듭니다
function mk(tag) {
  return document.createElement(tag);
}
// 안내 글을 화면에 보여 줍니다
function show(t) {
  el('msg').textContent = t;
}
// 실패하면 이유를 보여 줍니다
function fail(e) {
  show('오류: ' + e.message);
}

// [필기 불러오기]: 칸마다 카드를 그립니다
function showNotes() {
  show('불러오는 중입니다');
  google.script.run
    .withSuccessHandler(draw)
    .withFailureHandler(fail)
    .loadNotes();
}

// 필기 목록을 카드로 만듭니다
function draw(notes) {
  el('list').textContent = '';
  notes.forEach(function (n) {
    const card = mk('div');
    card.className = 'card';
    card.dataset.row = n.row;
    const p = mk('p');
    p.textContent = n.text;
    const b = mk('button');
    b.textContent = '요약';
    b.onclick = function () {
      one(card, null);
    };
    const s = mk('div');
    s.className = 'sum';
    card.append(p, b, s);
    el('list').appendChild(card);
  });
  show(notes.length + '칸을 불러왔습니다');
}

// 카드 한 칸을 요약해 아래에 보여 줍니다
function one(card, next) {
  const box = card.querySelector('.sum');
  box.textContent = '요약 중입니다';
  google.script.run
    .withSuccessHandler(function (t) {
      box.textContent = t;
      if (next) next();
    })
    .withFailureHandler(function (e) {
      box.textContent = '오류: ' + e.message;
      if (next) next();
    })
    .summarizeNote(Number(card.dataset.row),
      card.querySelector('p').textContent);
}

// [전체 요약]: 카드를 차례로 요약합니다
function sumAll() {
  const cards = Array.from(
    document.querySelectorAll('.card'));
  let i = 0;
  function step() {
    if (i >= cards.length) {
      show('전체 요약을 마쳤습니다');
      return;
    }
    show('요약 중 ' + (i + 1) + '/'
      + cards.length);
    one(cards[i++], step);
  }
  step();
}

// [PDF로 저장]: 파일 이름과 링크를 보여 줍니다
function makePdf() {
  show('PDF 저장 중입니다');
  google.script.run
    .withSuccessHandler(function (f) {
      show('저장했습니다');
      const a = mk('a');
      a.href = f.url;
      a.target = '_blank';
      a.textContent = f.name + ' 열기';
      el('pdf').textContent = '';
      el('pdf').appendChild(a);
    })
    .withFailureHandler(fail)
    .savePdfLink();
}
</script>
</body>
</html>
