<h1>시험 일정, 역순으로 짜기</h1>
<p><small>2026-11-02 · 연습용 가상 기사</small></p>
<p>시험일에서 거꾸로 계획을 세운다. 2주 전에는 범위를 훑고, 1주 전에는 문제를 풀고, 하루 전에는 틀린 문제만 다시 본다. 날짜마다 할 일이 정해지면 막판에 허둥대지 않고, 쉬는 날도 계획 안에 미리 넣어 둘 수 있다. 계획표는 벽에 붙여 두면 더 잘 지켜진다.</p>
