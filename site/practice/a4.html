<h1>요약을 맡길 때 확인할 것</h1>
<p><small>2026-11-04 · 연습용 가상 기사</small></p>
<p>AI가 만든 요약은 빠르지만 틀린 숫자나 빠진 내용이 있을 수 있다. 원문과 나란히 놓고 숫자, 이름, 날짜를 먼저 비교한다. 비교를 마친 요약만 내 노트에 옮겨 적고, 의심스러운 줄은 원문 쪽에 밑줄을 그어 다시 확인한다. 요약은 도움이 되는 초안일 뿐 정답이 아니다.</p>
