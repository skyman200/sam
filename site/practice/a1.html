<p><small>2026-11-09 · 연습용 가상 기사</small></p>
<p>필기는 베끼기보다 줄이기가 먼저다. 한 쪽을 세 문장으로 줄이고, 각 문장에 질문을 하나 붙인 뒤, 지난주 내용과 이어지는 고리를 한 줄 적는다. 이 세 단계를 마친 노트는 시험 전에 다시 읽기 쉽고, 어디가 부족한지도 한눈에 보인다. 오늘 한 쪽만 먼저 해 보자.</p>
