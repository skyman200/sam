<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 색과 글꼴: 흰 종이 + 옅은 세 가지 바탕(크림·분홍·하늘) */
:root {
  --font: "Pretendard", "Apple SD Gothic Neo",
    "Noto Sans KR", "Malgun Gothic", sans-serif;
  --bg: #ECEBE7; --sheet: #FFFFFF;
  --ink: #2B2B2B; --head: #3A3A3A;
  --sub: #6B6A66; --mut: #9A9893;
  --rule: #4A4A4A; --line: #E3E1DC;
  --dash: #D3D0CA;
  --cream: #F7F3EC; --blush: #F8F1F1;
  --mist: #EDF2F5;
  --r: 8px;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg);
  color: var(--ink);
  font: 17px/1.6 var(--font);
  word-break: keep-all;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit;
  cursor: pointer; }
button:focus-visible, .note:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px; }

/* 종이 한 장 */
.sheet { max-width: 1120px;
  margin: 40px auto;
  padding: 56px 56px 72px;
  background: var(--sheet);
  border: 1px solid #DCDAD5; }

/* 머리: NOTES 와 날짜, 굵은 선 */
.top { display: flex; flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 24px; padding-bottom: 18px;
  border-bottom: 2px solid var(--rule); }
.top > div { flex: 1 1 260px; min-width: 0; }
h1 { margin: 0; color: var(--head);
  font-size: clamp(48px, 8vw, 84px);
  font-weight: 800; line-height: .9;
  letter-spacing: -.025em; }
.lead { margin: 12px 0 0; color: var(--sub);
  font-size: 16px; }
.date { margin: 0 0 6px; color: var(--head);
  font-size: 12px; font-weight: 700;
  letter-spacing: .14em; }
.date span { margin-left: 12px;
  font-size: 16px; font-weight: 500;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums; }

/* 칸 이름표(SUMMARY, IDEAS …) */
.label { margin: 0; color: var(--head);
  font-size: 13px; font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase; }
.hint { margin: 2px 0 0; color: var(--mut);
  font-size: 14px; }
.row { display: flex; align-items: baseline;
  justify-content: space-between; gap: 12px; }

/* 벤토 격자: 12칸 */
.bento { display: grid; gap: 16px;
  grid-template-columns: repeat(12, 1fr);
  margin-top: 32px; }
.tile { min-width: 0; padding: 24px 26px;
  border-radius: var(--r);
  animation: rise .5s var(--ease) both; }
.t-sum { grid-column: span 7;
  grid-row: span 2; background: var(--cream);
  display: flex; flex-direction: column; }
.t-todo { grid-column: span 5;
  background: var(--mist);
  animation-delay: .06s; }
.t-stat { grid-column: span 5;
  border: 1px solid var(--line);
  animation-delay: .12s; }
.t-idea { grid-column: span 12;
  background: var(--blush);
  animation-delay: .18s; }

/* SUMMARY: 고른 노트의 3줄을 크게 */
.idx { margin: 0; color: var(--sub);
  font-size: 13px; font-weight: 600;
  letter-spacing: .08em;
  font-variant-numeric: tabular-nums; }
.t-sum h2 { margin: 28px 0 8px;
  font-size: clamp(24px, 2.6vw, 30px);
  font-weight: 700; line-height: 1.35;
  letter-spacing: -.015em; }
.wait { margin: 20px 0 0; color: var(--mut);
  font-size: 20px; font-weight: 600; }
.orig { margin-top: auto; padding-top: 32px; }
.orig .label { font-size: 12px;
  color: var(--sub); }
.orig .ruled { --pg: var(--cream);
  margin-top: 4px; color: var(--sub); }
.lines { list-style: none; margin: 20px 0 0;
  padding: 0; }
.lines li { display: grid; gap: 14px;
  grid-template-columns: 30px 1fr;
  padding: 15px 0;
  border-top: 1px dashed #CFC8BB;
  font-size: 20px; font-weight: 500;
  line-height: 1.5; }
.lines li:last-child {
  border-bottom: 1px dashed #CFC8BB; }
.lines b { color: var(--mut); font-size: 13px;
  font-weight: 700; padding-top: 4px;
  font-variant-numeric: tabular-nums; }
.empty { margin: auto 0; padding: 40px 0;
  color: var(--mut); font-size: 22px;
  font-weight: 600; line-height: 1.5; }
.sum-foot { display: flex; gap: 8px;
  align-items: center; padding-top: 20px; }
.sum-foot .grow { flex: 1; }

/* 작은 버튼: 테두리만 */
.btn { padding: 8px 14px; white-space: nowrap;
  border: 1px solid #BDB9B1;
  border-radius: 6px; background: #fff;
  font-size: 14px; font-weight: 600;
  transition: border-color .2s var(--ease),
    background-color .2s var(--ease); }
.btn:hover { border-color: var(--ink); }
.btn:disabled { color: var(--mut);
  border-color: var(--line); cursor: default; }
.btn.ink { background: var(--ink);
  border-color: var(--ink); color: #fff; }
.btn.ink:hover { background: #000; }

/* TO DO: 할 일 = 버튼 세 개 */
.todo { list-style: none; margin: 14px 0 0;
  padding: 0; }
.task { display: grid; width: 100%;
  grid-template-columns: 20px 1fr auto;
  gap: 14px; align-items: center;
  padding: 13px 4px; text-align: left;
  background: none; border: 0;
  border-bottom: 1px dashed #C9D3DA;
  transition: background-color .2s var(--ease); }
.task:hover { background: rgba(255,255,255,.55); }
.task strong { display: block; font-size: 17px;
  font-weight: 700; }
.task small { display: block; color: var(--sub);
  font-size: 13px; }
.dot { width: 16px; height: 16px;
  border: 1.5px solid #8E9AA3;
  border-radius: 50%; position: relative; }
.task.busy .dot { border-style: dashed;
  border-color: var(--ink);
  animation: spin 1.4s linear infinite; }
.task.done .dot { background: var(--ink);
  border-color: var(--ink); }
.task.done .dot::after { content: "";
  position: absolute; left: 4.5px; top: 1.5px;
  width: 4px; height: 8px;
  border: solid #fff;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg); }
.task.done strong { color: var(--sub); }
.go { color: var(--sub); }
#pdf a { display: inline-flex; gap: 6px;
  margin-top: 12px; color: var(--ink);
  font-size: 15px; font-weight: 600;
  text-underline-offset: 3px; }

/* PROGRESS: 숫자와 칸 막대 */
.big { margin: 14px 0 0; font-size: 56px;
  font-weight: 800; line-height: 1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; }
.big small { color: var(--mut);
  font-size: 22px; font-weight: 600;
  letter-spacing: 0; }
.seg { display: grid; gap: 4px; margin: 16px 0 0;
  grid-template-columns: repeat(10, 1fr); }
.seg i { height: 10px; border-radius: 2px;
  background: var(--line);
  transition: background-color .4s var(--ease); }
.seg i.on { background: var(--ink); }
.seg i.off { background: transparent;
  border: 1px dashed var(--line); }
#msg { min-height: 24px; margin: 12px 0 0;
  color: var(--sub); font-size: 14px; }
#msg.err { color: #9B2F2A; font-weight: 600; }

/* IDEAS: 노트마다 한 줄 핵심 */
.ideas { list-style: none; margin: 12px 0 0;
  padding: 0; columns: 2; column-gap: 40px; }
.ideas li { break-inside: avoid; }
.ideas button { display: grid; width: 100%;
  grid-template-columns: 28px 1fr; gap: 8px;
  padding: 8px 0; text-align: left;
  background: none; border: 0;
  border-bottom: 1px dashed #E2CFCF;
  font-size: 15px; line-height: 1.5; }
.ideas button:hover span {
  text-decoration: underline;
  text-underline-offset: 3px; }
.ideas b { color: var(--mut); font-size: 12px;
  padding-top: 2px;
  font-variant-numeric: tabular-nums; }
.ideas .none { padding: 8px 0; color: var(--mut);
  font-size: 15px; }

/* NOTES: 줄 노트 카드들 */
.notes-head { display: flex; gap: 16px;
  align-items: baseline;
  justify-content: space-between;
  margin: 56px 0 0; padding-bottom: 12px;
  border-bottom: 1px solid var(--rule); }
.notes-head h2 { margin: 0; color: var(--head);
  font-size: 30px; font-weight: 800;
  letter-spacing: -.01em; }
#list { display: grid; gap: 16px;
  grid-template-columns: repeat(12, 1fr);
  margin-top: 20px; }
.note { grid-column: span var(--span, 6);
  display: flex; flex-direction: column;
  min-width: 0; padding: 20px 22px 18px;
  background: #fff; border-radius: var(--r);
  border: 1px solid var(--line);
  cursor: pointer;
  animation: rise .45s var(--ease) both;
  transition: border-color .2s var(--ease); }
.note:hover { border-color: #B9B5AD; }
.note.on { border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink); }
.note h3 { margin: 14px 0 0; font-size: 18px;
  font-weight: 700; line-height: 1.5; }
.state { color: var(--mut); font-size: 13px;
  font-weight: 600; }
.state.ok { color: var(--ink); }
/* 점선 줄 노트: 줄 높이 30px 마다 점선 */
.ruled { --pg: #fff;
  margin: 6px 0 0; color: #444;
  font-size: 15px; line-height: 30px;
  background-image:
    linear-gradient(90deg, var(--pg) 3px,
      transparent 3px),
    linear-gradient(transparent 29px,
      var(--dash) 29px);
  background-size: 6px 100%, 100% 30px; }
.note .lines { margin: 16px 0 0;
  padding: 2px 16px; border-radius: 6px;
  background: var(--cream); }
.note .lines li { font-size: 15px;
  padding: 9px 0; gap: 10px;
  grid-template-columns: 22px 1fr;
  border-top: 1px dashed #DDD5C7; }
.note .lines li:first-child { border-top: 0; }
.note .lines li:last-child { border-bottom: 0; }
.note .lines b { padding-top: 2px;
  font-size: 12px; }
.note .bad { margin: 14px 0 0;
  color: #9B2F2A; font-size: 14px; }
.note-foot { display: flex; gap: 8px;
  justify-content: flex-end;
  margin-top: auto; padding-top: 14px; }
.blank { grid-column: 1 / -1; margin: 0;
  padding: 48px 0; color: var(--mut);
  text-align: center; font-size: 16px;
  border: 1px dashed var(--dash);
  border-radius: var(--r); }

@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
}
@keyframes spin { to { transform: rotate(1turn); } }
@media (prefers-reduced-motion: reduce) {
  .tile, .note, .task.busy .dot {
    animation: none; }
}

/* 폰: 한 줄로 쌓기 */
@media (max-width: 860px) {
  .sheet { margin: 0; padding: 28px 18px 48px;
    border: 0; }
  .bento, #list { gap: 12px; }
  .bento > *, #list > * {
    grid-column: 1 / -1 !important;
    grid-row: auto !important; }
  .tile { padding: 20px; }
  .ideas { columns: 1; }
  .lines li { font-size: 17px; }
  .t-sum h2 { margin-top: 20px; font-size: 22px; }
  .sum-foot .btn { padding: 8px 11px; }
  .notes-head { margin-top: 40px; }
}
</style>
</head>

<body>
<main class="sheet">
  <header class="top">
    <div>
      <h1>NOTES</h1>
      <p class="lead">요약 노트 · 필기를 칸마다 3줄로 줄입니다</p>
    </div>
    <p class="date">DATE :<span id="today"></span></p>
  </header>

  <section class="bento">
    <!-- 큰 칸: 고른 노트의 요약 -->
    <article class="tile t-sum" id="hero"></article>

    <!-- 할 일 = 버튼 세 개 -->
    <article class="tile t-todo">
      <p class="label">To do</p>
      <ul class="todo">
        <li><button class="task" id="tLoad"
          onclick="showNotes()">
          <i class="dot"></i>
          <span><strong>필기 불러오기</strong>
          <small>'필기' 탭 A열에서 최대 10칸</small></span>
          <span class="go">→</span></button></li>
        <li><button class="task" id="tAll"
          onclick="sumAll()">
          <i class="dot"></i>
          <span><strong>전체 요약</strong>
          <small>노트마다 3줄로 차례대로</small></span>
          <span class="go">→</span></button></li>
        <li><button class="task" id="tPdf"
          onclick="makePdf()">
          <i class="dot"></i>
          <span><strong>PDF로 저장</strong>
          <small>시트를 한 장으로 드라이브에</small></span>
          <span class="go">→</span></button></li>
      </ul>
      <p id="pdf"></p>
    </article>

    <!-- 진행: 몇 칸 요약했나 -->
    <article class="tile t-stat">
      <div class="row">
        <p class="label">Progress</p>
        <p class="idx">요약 완료</p>
      </div>
      <p class="big" id="count">0<small> / 0</small></p>
      <div class="seg" id="seg"></div>
      <p id="msg"></p>
    </article>

    <!-- 한 줄 핵심 모음 -->
    <article class="tile t-idea">
      <p class="label">Ideas</p>
      <p class="hint">노트마다 요약 첫 줄</p>
      <ol class="ideas" id="ideas"></ol>
    </article>
  </section>

  <div class="notes-head">
    <h2>NOTES</h2>
    <p class="idx" id="noteCount">필기 0칸</p>
  </div>
  <div id="list">
    <p class="blank">[필기 불러오기]를 누르면 노트 카드가 여기 깔립니다</p>
  </div>
</main>

<script>
let notes = [];   // { row, text, sum, busy, err }
let pick = 0;     // SUMMARY 칸에 크게 보일 노트 번호

// 아이디로 화면 요소를 찾습니다
function el(id) {
  return document.getElementById(id);
}
// 요소를 만들고 글(textContent)과 이름표를 붙입니다
function mk(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
// 01, 02 … 두 자리 번호
function two(i) {
  return String(i + 1).padStart(2, '0');
}
// 안내 글을 보여 줍니다
function show(t) {
  el('msg').className = '';
  el('msg').textContent = t;
}
// 실패하면 이유를 보여 주고 도는 표시를 멈춥니다
function fail(e) {
  el('msg').className = 'err';
  el('msg').textContent = '오류: ' + e.message;
  document.querySelectorAll('.task.busy')
    .forEach(function (b) {
      b.classList.remove('busy');
    });
}
// 할 일 버튼 상태: '' · 'busy' · 'done'
function task(id, state) {
  const b = el(id);
  b.classList.remove('busy', 'done');
  if (state) b.classList.add(state);
}
// 요약 글을 줄 목록으로 나눕니다(번호·기호 떼기)
function lines(t) {
  return String(t || '').split(/\n+/)
    .map(function (s) {
      return s.replace(
        /^\s*(\d+[.)]|[-•*·])\s*/, '').trim();
    })
    .filter(Boolean);
}
// 필기를 첫 문장(제목)과 나머지로 나눕니다
function cut(text) {
  const m = text.match(
    /^([\s\S]{6,70}?[.?!])\s+([\s\S]+)$/);
  return m ? { head: m[1], body: m[2] }
    : { head: '', body: text };
}
// 첫 문장이 길면 낱말 끝에서 잘라 제목으로 씁니다
function short(t) {
  if (t.length <= 30) return t;
  const cut = t.slice(0, 30);
  const sp = cut.lastIndexOf(' ');
  return (sp > 12 ? cut.slice(0, sp) : cut) + '…';
}
// 번호 붙은 요약 목록(ol)을 만듭니다
function lineList(t) {
  const ol = mk('ol', 'lines');
  lines(t).forEach(function (s, i) {
    const li = mk('li');
    li.append(mk('b', '', two(i)), mk('span', '', s));
    ol.appendChild(li);
  });
  return ol;
}

// [필기 불러오기]: 시트에서 필기를 받아 옵니다
function showNotes() {
  task('tLoad', 'busy');
  show('불러오는 중입니다');
  google.script.run
    .withSuccessHandler(draw)
    .withFailureHandler(fail)
    .loadNotes();
}

// 받아 온 필기로 화면 전체를 다시 그립니다
function draw(list) {
  notes = list.map(function (n) {
    return { row: n.row, text: n.text, sum: '' };
  });
  pick = 0;
  drawList();
  drawSide();
  task('tLoad', 'done');
  task('tAll', '');
  show(notes.length + '칸을 불러왔습니다');
}

// 노트 카드 너비: 12칸을 7·5, 4·4·4 … 로 나눕니다
function spans(n) {
  const rows = [[7, 5], [4, 4, 4], [5, 7], [6, 6]];
  const out = [];
  let r = 0;
  while (out.length < n) {
    let row = rows[r++ % rows.length];
    const left = n - out.length;
    if (left < row.length) {
      row = left === 1 ? [12] : [6, 6];
    }
    out.push.apply(out, row);
  }
  return out;
}

// 노트 카드들을 그립니다
function drawList() {
  const box = el('list');
  box.textContent = '';
  if (notes.length === 0) {
    box.appendChild(mk('p', 'blank',
      "'필기' 탭 A2부터 글을 넣어 주세요"));
  }
  const w = spans(notes.length);
  notes.forEach(function (n, i) {
    const c = mk('article', 'note');
    c.id = 'n' + i;
    c.tabIndex = 0;
    c.style.setProperty('--span', w[i]);
    c.style.animationDelay = (i * 40) + 'ms';
    c.onclick = function () { choose(i); };
    c.onkeydown = function (e) {
      if (e.key === 'Enter') choose(i);
    };
    box.appendChild(c);
    drawNote(i);
  });
  el('noteCount').textContent =
    '필기 ' + notes.length + '칸';
}

// 카드 한 장(번호·제목·줄 노트·요약·버튼)
function drawNote(i) {
  const n = notes[i];
  const c = el('n' + i);
  const part = cut(n.text);
  c.textContent = '';
  c.classList.toggle('on', i === pick);

  const top = mk('div', 'row');
  top.appendChild(mk('p', 'label', 'Note ' + two(i)));
  const st = mk('span', 'state',
    n.busy ? '요약 중' : n.sum ? '요약 완료' : '요약 전');
  if (n.sum) st.classList.add('ok');
  top.appendChild(st);
  c.appendChild(top);

  if (part.head) c.appendChild(mk('h3', '', part.head));
  c.appendChild(mk('p', 'ruled', part.body));
  if (n.sum) c.appendChild(lineList(n.sum));
  if (n.err) c.appendChild(mk('p', 'bad', '오류: ' + n.err));

  const foot = mk('div', 'note-foot');
  const b = mk('button', 'btn',
    n.busy ? '요약 중…' : n.sum ? '다시 요약' : '요약');
  b.disabled = !!n.busy;
  b.onclick = function (e) {
    e.stopPropagation();
    one(i, null);
  };
  foot.appendChild(b);
  c.appendChild(foot);
}

// 노트를 골라 SUMMARY 칸에 크게 보여 줍니다
function choose(i) {
  const old = el('n' + pick);
  if (old) old.classList.remove('on');
  pick = i;
  el('n' + i).classList.add('on');
  drawHero();
}

// 오른쪽 세 칸과 큰 칸을 새로 그립니다
function drawSide() {
  drawHero();
  drawCount();
  drawIdeas();
}

// SUMMARY 큰 칸
function drawHero() {
  const h = el('hero');
  h.textContent = '';
  const top = mk('div', 'row');
  top.appendChild(mk('p', 'label', 'Summary'));
  h.appendChild(top);

  if (notes.length === 0) {
    h.appendChild(mk('p', 'empty',
      '필기를 불러오면\n고른 노트의 3줄 요약이\n여기에 크게 보입니다'));
    h.lastChild.style.whiteSpace = 'pre-line';
    return;
  }
  const n = notes[pick];
  const part = cut(n.text);
  top.appendChild(mk('p', 'idx',
    'NOTE ' + two(pick) + ' / '
    + String(notes.length).padStart(2, '0')));
  h.appendChild(mk('h2', '', part.head || short(n.text)));
  if (n.sum) {
    h.appendChild(lineList(n.sum));
  } else {
    h.appendChild(mk('p', 'wait',
      n.busy ? '요약하는 중입니다…' : '아직 요약 전입니다'));
  }

  // 아래쪽: 원문을 줄 노트로
  const orig = mk('div', 'orig');
  orig.append(mk('p', 'label', '원문'),
    mk('p', 'ruled', n.text));
  h.appendChild(orig);

  const foot = mk('div', 'sum-foot');
  const prev = mk('button', 'btn', '← 이전');
  prev.disabled = pick === 0;
  prev.onclick = function () { choose(pick - 1); };
  const next = mk('button', 'btn', '다음 →');
  next.disabled = pick === notes.length - 1;
  next.onclick = function () { choose(pick + 1); };
  const go = mk('button', 'btn ink',
    n.sum ? '다시 요약' : '이 노트 요약');
  go.disabled = !!n.busy;
  go.onclick = function () { one(pick, null); };
  foot.append(prev, next, mk('span', 'grow'), go);
  h.appendChild(foot);
}

// PROGRESS: 요약한 칸 수와 10칸 막대
function drawCount() {
  const done = notes.filter(function (n) {
    return n.sum;
  }).length;
  const c = el('count');
  c.textContent = done;
  c.appendChild(mk('small', '', ' / ' + notes.length));
  const seg = el('seg');
  seg.textContent = '';
  for (let i = 0; i < 10; i++) {
    const s = mk('i');
    if (i >= notes.length) s.className = 'off';
    else if (notes[i].sum) s.className = 'on';
    seg.appendChild(s);
  }
}

// IDEAS: 요약 첫 줄만 모읍니다(누르면 그 노트로)
function drawIdeas() {
  const box = el('ideas');
  box.textContent = '';
  notes.forEach(function (n, i) {
    const first = lines(n.sum)[0];
    if (!first) return;
    const b = mk('button');
    b.append(mk('b', '', two(i)), mk('span', '', first));
    b.onclick = function () { choose(i); };
    const li = mk('li');
    li.appendChild(b);
    box.appendChild(li);
  });
  if (!box.firstChild) {
    box.appendChild(mk('li', 'none',
      '요약을 하면 첫 줄이 여기 모입니다'));
  }
}

// 노트 한 칸을 요약합니다(끝나면 next 실행)
function one(i, next) {
  const n = notes[i];
  n.busy = true;
  n.err = '';
  drawNote(i);
  choose(i);
  google.script.run
    .withSuccessHandler(function (t) {
      n.busy = false;
      n.sum = String(t);
      drawNote(i);
      drawSide();
      if (next) next();
    })
    .withFailureHandler(function (e) {
      n.busy = false;
      n.err = e.message;
      drawNote(i);
      drawHero();
      if (next) next();
    })
    .summarizeNote(n.row, n.text);
}

// [전체 요약]: 카드를 차례로 요약합니다
function sumAll() {
  if (notes.length === 0) {
    show('먼저 필기를 불러오세요');
    return;
  }
  task('tAll', 'busy');
  let i = 0;
  function step() {
    if (i >= notes.length) {
      task('tAll', 'done');
      show('전체 요약을 마쳤습니다');
      return;
    }
    show('요약 중 ' + (i + 1) + ' / ' + notes.length);
    one(i++, step);
  }
  step();
}

// [PDF로 저장]: 파일 이름과 링크를 보여 줍니다
function makePdf() {
  task('tPdf', 'busy');
  show('PDF 저장 중입니다');
  google.script.run
    .withSuccessHandler(function (f) {
      task('tPdf', 'done');
      show('저장했습니다');
      const a = mk('a', '', f.name + ' 열기 →');
      a.href = f.url;
      a.target = '_blank';
      el('pdf').textContent = '';
      el('pdf').appendChild(a);
    })
    .withFailureHandler(fail)
    .savePdfLink();
}

// 오늘 날짜를 머리에 적고 빈 화면을 그립니다
(function start() {
  const d = new Date();
  el('today').textContent = d.getFullYear() + ' / '
    + String(d.getMonth() + 1).padStart(2, '0') + ' / '
    + String(d.getDate()).padStart(2, '0');
  drawSide();
})();
</script>
